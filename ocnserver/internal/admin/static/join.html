<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a number — OpenCarrier.Network</title>
<style>
  :root{--bg:#0a0e17;--panel:#0f172a;--panel2:#1e293b;--border:#1e293b;--text:#94a3b8;--textlight:#f8fafc;--blue:#3b82f6;--bluehover:#2563eb;--green:#10b981}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--border);max-width:460px;width:100%;padding:28px;border-radius:10px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--textlight);font-weight:700;margin-bottom:6px;font-size:18px}
  .brand svg{width:20px;height:20px;color:var(--blue)}
  h1{color:var(--textlight);font-size:22px;margin:14px 0 6px}
  p.sub{font-size:14px;line-height:1.5;margin-bottom:18px}
  label{display:block;font-size:12px;color:var(--text);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--textlight);padding:10px 12px;font-size:15px;border-radius:6px;margin-bottom:16px}
  input:focus{outline:none;border-color:var(--blue)}
  button{width:100%;background:var(--blue);color:#fff;border:none;padding:12px;font-size:15px;font-weight:600;border-radius:6px;cursor:pointer}
  button:hover{background:var(--bluehover)}
  button:disabled{opacity:.6;cursor:default}
  .hidden{display:none}
  #result{margin-top:20px}
  #result img{display:block;width:220px;height:220px;margin:12px auto;background:#fff;border-radius:6px;padding:6px}
  .code{background:var(--bg);border:1px solid var(--border);padding:10px;border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:var(--textlight);margin-bottom:12px}
  .hint{font-size:12px;color:var(--text);line-height:1.5}
  .err{color:#f87171;font-size:13px;margin-top:10px}
  .ok{color:var(--green);font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-width="2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4a6 6 0 110 12 6 6 0 010-12z"></path><circle cx="12" cy="12" r="2" fill="currentColor"></circle></svg>
      OpenCarrier.Network
    </div>
    <h1>Get a phone number</h1>
    <p class="sub">Provision a number on the OpenCarrier exchange. Scan or copy the link into the OCN softphone — the first free number is assigned when you claim it.</p>

    <form id="join-form">
      <label for="name">Display name (optional)</label>
      <input id="name" name="display_name" maxlength="60" placeholder="e.g. Jane Doe" autocomplete="off">
      <button id="go" type="submit">Get a number</button>
      <div id="err" class="err"></div>
    </form>

    <div id="result" class="hidden">
      <div class="ok" id="msg"></div>
      <img id="qr" alt="Provisioning QR code">
      <div class="code" id="link"></div>
      <button type="button" onclick="copyLink()">Copy link</button>
      <p class="hint" id="expiry"></p>
    </div>
  </div>

<script>
const form = document.getElementById("join-form");
const err = document.getElementById("err");
const btn = document.getElementById("go");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await fetch("/join", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ display_name: document.getElementById("name").value.trim() }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("msg").textContent = "Your provisioning link is ready:";
    document.getElementById("qr").src = data.qr_data;
    document.getElementById("link").textContent = data.url;
    document.getElementById("expiry").textContent = "Expires " + new Date(data.expires_at).toLocaleString() +
      ". Open the OCN softphone and paste the link (or scan the QR) to claim your number.";
    form.classList.add("hidden");
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Get a number";
  }
});

function copyLink() {
  const link = document.getElementById("link").textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
    .then(() => { document.getElementById("expiry").textContent = "Copied!"; })
    .catch(() => {
      const t = document.getElementById("link");
      const r = document.createRange(); r.selectNodeContents(t);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      document.execCommand("copy");
    });
}
</script>
</body>
</html>
