syntax = "proto3";

package ocn.ocnserver;

option go_package = "github.com/open-carrier-network/ocn/proto/ocnserver";

import "common.proto";
import "google/protobuf/empty.proto";

// OCNServer-to-OCNServer service for cross-server calls
service OCNServerService {
  rpc IncomingCall(IncomingCallRequest) returns (IncomingCallResponse);
  rpc CallAnswered(CallAnsweredRequest) returns (CallAnsweredResponse);
  rpc CallEnded(CallEndedRequest) returns (google.protobuf.Empty);
  rpc ICECandidateExchange(ICEExchangeRequest) returns (ICEExchangeResponse);

  // Bidirectional relay for a cross-server call. The caller's server dials the
  // callee's server and both exchange CallEvents over the stream.
  rpc BridgeCall(stream CallEvent) returns (stream CallEvent);

  // Deliver an undelivered direct message to a user hosted on this server.
  rpc DeliverDM(DMEnvelope) returns (DMDeliveryResponse);
}

// A direct message relayed between servers for a recipient on the callee side.
message DMEnvelope {
  string message_id = 1;
  string client_id = 2;
  string from = 3;      // canonical full number
  string from_name = 4;
  string to = 5;        // canonical full number of the local recipient
  string kind = 6;      // "text" | "image"
  string text = 7;
  DMImage image = 8;
  int64 created_at = 9; // unix millis
}

message DMImage {
  string name = 1;
  string mime = 2;
  string b64 = 3;
}

message DMDeliveryResponse {
  bool accepted = 1;
  string error_message = 2;
}

// Events exchanged over BridgeCall between two OCN servers.
message CallEvent {
  enum Type {
    UNKNOWN = 0;
    INCOMING = 1;   // caller server -> callee server: start a call
    RINGING = 2;    // callee server -> caller server: callee is ringing
    ANSWER = 3;     // callee server -> caller server: callee answered (sdp)
    ICE = 4;        // either direction: a trickled ICE candidate
    HANGUP = 5;     // either direction: call ended (reason)
    BUSY = 6;       // callee server -> caller server: callee unavailable
  }
  string call_id = 1;
  Type type = 2;
  ocn.common.PhoneNumber caller_number = 3;
  ocn.common.DisplayName caller_name = 4;
  string destination = 5;           // 7-digit local number being called
  ocn.common.SDPSession sdp = 6;    // offer (INCOMING) / answer (ANSWER)
  ocn.common.ICECandidate candidate = 7;
  string reason = 8;                // HANGUP reason
}

message IncomingCallRequest {
  string call_id = 1;
  ocn.common.PhoneNumber caller_number = 2;
  ocn.common.DisplayName caller_name = 3;
  ocn.common.PhoneNumber destination_number = 4;
  ocn.common.SDPSession offer = 5;
  string source_area_code = 6;
}

message IncomingCallResponse {
  bool accepted = 1;
  ocn.common.SDPSession answer = 2;
  string error_message = 3;
}

message CallAnsweredRequest {
  string call_id = 1;
  ocn.common.SDPSession answer = 2;
}

message CallAnsweredResponse {
  bool success = 1;
}

message CallEndedRequest {
  string call_id = 1;
  string reason = 2;
}

message ICEExchangeRequest {
  string call_id = 1;
  repeated ocn.common.ICECandidate candidates = 2;
}

message ICEExchangeResponse {
  bool success = 1;
}
