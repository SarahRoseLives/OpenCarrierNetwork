syntax = "proto3";

package ocn.registry;

option go_package = "github.com/open-carrier-network/ocn/proto/registry";

import "common.proto";
import "google/protobuf/empty.proto";

service OCNRegistry {
  // OCNServer management
  rpc RegisterOCNServer(RegisterOCNServerRequest) returns (RegisterOCNServerResponse);
  rpc DeregisterOCNServer(DeregisterOCNServerRequest) returns (google.protobuf.Empty);
  rpc ListOCNServers(ListOCNServersRequest) returns (ListOCNServersResponse);

  // Routing
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse);
  rpc ResolveService(ResolveServiceRequest) returns (ResolveServiceResponse);

  // STUN
  rpc GetICECandidates(ICECandidateRequest) returns (ICECandidateResponse);

  // Push: lets a registered OCN server wake one of its offline devices using
  // the network's shared Firebase credential. Stateless (token passed per call).
  rpc PushDevice(PushDeviceRequest) returns (google.protobuf.Empty);
}

// Push a data message to a single device via the shared Firebase project.
message PushDeviceRequest {
  string token = 1;
  string call_id = 2;
  string caller_number = 3;  // 7-digit or full? formatted number string
  string caller_name = 4;
  string area_code = 5;      // sending server's area code (for auth/audit)
  int64 timestamp = 6;       // unix seconds; signed by the calling server
  bytes signature = 7;       // Ed25519 over area_code|timestamp|token
  string message_type = 8;   // "" = incoming_call (call_id required), "voicemail" = new voicemail
}

// OCNServer registration
message RegisterOCNServerRequest {
  string name = 1;
  string description = 2;
  string server_address = 3;   // gRPC endpoint for this ocnserver
  bytes ocnserver_public_key = 4;  // Ed25519 public key for ocnserver identity
  string requested_area_code = 5;  // Optional preference, empty = auto-assign
}

message RegisterOCNServerResponse {
  bool success = 1;
  string assigned_area_code = 2;
  string error_message = 3;
}

message DeregisterOCNServerRequest {
  string area_code = 1;
  bytes ocnserver_public_key = 2;  // Must sign to prove ownership
  int64 timestamp = 3;             // unix seconds
  bytes signature = 4;             // Ed25519 over area_code|timestamp
}

// OCNServer directory
message OCNServerInfo {
  string area_code = 1;
  string name = 2;
  string description = 3;
  string server_address = 4;
  bytes ocnserver_public_key = 5;
  int64 registered_at = 6;
  string status = 7;  // "ACTIVE", "SUSPENDED"
}

message ListOCNServersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListOCNServersResponse {
  repeated OCNServerInfo ocnservers = 1;
  int32 total_count = 2;
}

// Routing
message GetRouteRequest {
  string area_code = 1;
}

message GetRouteResponse {
  bool found = 1;
  OCNServerInfo ocnserver = 2;
}

// Resolve a full 800/900 service number to its hosting exchange.
message ResolveServiceRequest {
  string full_number = 1;  // 10 digits, e.g. "8007766001"
}

message ResolveServiceResponse {
  bool found = 1;
  OCNServerInfo ocnserver = 2;  // hosting exchange
  string full_number = 3;
  string vanity = 4;            // e.g. "ROO-M001"
  string name = 5;
  string description = 6;
}

// STUN
message ICECandidateRequest {
  bytes client_id = 1;  // kSIM public key or session ID
}

message ICECandidateResponse {
  repeated ocn.common.ICECandidate candidates = 1;
  string server_reflexive_address = 2;  // STUN-derived public IP:port
  repeated ICEServer ice_servers = 3;   // STUN/TURN servers clients should use
}

// An ICE server entry (mirrors WebRTC RTCIceServer).
message ICEServer {
  repeated string urls = 1;   // e.g. "stun:stun.l.google.com:19302", "turn:host:3478?transport=udp"
  string username = 2;        // TURN long-term credential user ("" for STUN)
  string credential = 3;      // TURN password ("" for STUN)
}
